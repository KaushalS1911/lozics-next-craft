# Optional: GitHub Actions workflow for Render deployment
# This file is optional - Render can auto-deploy without it

name: Deploy to Render

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'render.yaml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Trigger Render Deployment
        run: |
          echo "Render will automatically deploy when changes are pushed"
          echo "No manual deployment trigger needed"

      - name: Deployment Status
        run: |
          echo "✅ Code pushed to main branch"
          echo "🚀 Render will start deploying automatically"
          echo "📊 Check deployment status at: https://dashboard.render.com"

